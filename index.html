<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#43a82b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fred's Learning Adventure</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Comic Sans MS','Chalkboard SE','Segoe Print',sans-serif;color:#2b2b4a;background:#e3f4ff}
#app{height:100%;display:flex;flex-direction:column;transition:background .3s}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:64px}
.btn{border:0;border-radius:18px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s;color:#fff}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.back{background:#fff;font-size:22px;padding:8px 18px;color:#555}
.title{flex:1;text-align:center;font-size:clamp(18px,4vw,32px);font-weight:bold}
.stars{background:#ffd23f;border-radius:20px;padding:6px 14px;font-size:22px;font-weight:bold;color:#7a3b00;box-shadow:0 4px 0 #c89400;white-space:nowrap}
.lock{background:transparent;border:0;font-size:22px;opacity:.35;padding:6px}
main{flex:1;overflow:auto;padding:8px 16px 28px;-webkit-overflow-scrolling:touch}

.home{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.home h1{margin:6px 0 0;font-size:clamp(32px,7vw,60px);color:#ff5a2c;text-shadow:0 3px 0 #fff,0 6px 0 #c53a14;line-height:1.05}
.fredbig{width:min(36vw,220px);animation:bob 2.2s ease-in-out infinite;cursor:pointer}
@keyframes bob{50%{transform:translateY(-12px) rotate(2deg)}}
.big{width:min(88vw,520px);font-size:clamp(24px,5vw,36px);padding:16px 10px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;max-width:950px;margin:10px auto}
.mbtn{padding:18px 8px;font-size:clamp(18px,3.4vw,28px);display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:26px}
.mbtn span{font-size:clamp(38px,7vw,60px)}
.mbtn small{font-size:.6em;opacity:.9;font-weight:normal}
.home .menu{width:100%}
@media (max-width:520px){
 .fredbig{width:110px}
 .hm{grid-template-columns:1fr;gap:10px}
 .hm .mbtn{flex-direction:row;padding:12px 18px;justify-content:flex-start;gap:16px;text-align:left}
 .hm .mbtn span{font-size:46px}
 .menu{gap:10px}
 .mbtn{padding:12px 6px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
}
.hm{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.hm .mbtn{padding:30px 8px;font-size:clamp(22px,4.6vw,38px)}
.hm .mbtn span{font-size:clamp(60px,11vw,96px)}
.hm .mbtn small{font-size:.55em}
.hd{max-width:950px;margin:16px auto 4px;font-size:22px;font-weight:bold}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:1000px;margin:0 auto}
.card{background:#fff;border-radius:26px;border:5px solid;text-align:center;padding:8px 4px 10px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.card .pic{font-size:clamp(46px,9vw,72px);line-height:1.15}
.card .g{font-size:clamp(38px,8vw,60px);font-weight:bold;line-height:1}
.card .w{font-size:clamp(16px,3vw,22px);font-weight:bold;color:#2b2b4a}
.card.rec{outline:5px dashed #e62e2e}
.card.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}
.tip{text-align:center;font-size:18px;margin:4px 0 12px}
.playrow{text-align:center;margin:16px 0 4px}
.playrow .btn{background:#8453e0;font-size:24px;padding:14px 30px}

.ft{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.ftpic{font-size:clamp(90px,20vw,150px);line-height:1}
.letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lt{background:#fff;border:5px solid #43a82b;border-radius:22px;min-width:80px;padding:6px 14px 14px;text-align:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.lt .l{font-size:clamp(44px,9vw,80px);font-weight:bold;line-height:1.1}
.lt .d{display:block;margin:2px auto 0;background:#ff5a2c;border-radius:50%;width:18px;height:18px}
.lt .d.dash{border-radius:10px;width:80%;height:10px;background:#f0509a}
.lt.on{background:#fff3b0;transform:scale(1.12);border-color:#ff9a1f}
.lt.blank{border-style:dashed;border-color:#a67cf0;color:#a67cf0}
.lt.filled{border-color:#ff9a1f;background:#fff3b0}
.word{font-size:clamp(50px,12vw,96px);font-weight:bold;color:#2f7d1c;min-height:1.2em}
.word.show{animation:pop .5s}
.row2{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.go{font-size:24px;padding:14px 24px}

.game{max-width:820px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.prompt{font-size:clamp(20px,4.2vw,32px);font-weight:bold;cursor:pointer}
.q{font-size:clamp(70px,16vw,130px);line-height:1}
.qword{font-size:clamp(54px,13vw,100px);font-weight:bold}
.opts{display:grid;gap:14px;width:100%}
.opt{background:#fff;border:5px solid #a67cf0;border-radius:24px;padding:10px 4px;font-size:clamp(40px,9vw,76px);font-weight:bold;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.15);line-height:1.1;display:flex;align-items:center;justify-content:center;min-height:90px}
.opt.sm{font-size:clamp(24px,5vw,42px)}
.opt.em{font-size:clamp(46px,10vw,80px)}
.opt.bad{animation:shake .4s;background:#ffd6d6;border-color:#e62e2e}
.opt.good{background:#c8f5a8;border-color:#43a82b}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.prog{height:16px;width:100%;background:#fff;border-radius:10px;overflow:hidden;border:3px solid #fff}
.prog i{display:block;height:100%;background:#43a82b;transition:width .3s}
.cheer{font-size:clamp(34px,8vw,60px);font-weight:bold;color:#ff5a2c}
.conf{position:fixed;top:-40px;font-size:34px;pointer-events:none;animation:fall 1.8s ease-in forwards;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

/* memory */
.mem{display:grid;gap:12px;width:100%;max-width:700px}
.mc{aspect-ratio:1;min-height:80px;border-radius:20px;border:5px solid #8453e0;background:#a67cf0;font-size:clamp(34px,8vw,60px);font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);color:#fff}
.mc.up{background:#fff;color:#2b2b4a;border-color:#ffa534}
.mc.ok{background:#c8f5a8;border-color:#43a82b;color:#2b2b4a}
.mc.sm{font-size:clamp(20px,4.5vw,34px)}

/* story */
.sbook{max-width:820px;margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.spic{font-size:clamp(110px,26vw,200px);line-height:1;background:#fff;border-radius:36px;padding:10px 30px;border:6px solid #ffc933;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.stxt{font-size:clamp(30px,6.5vw,56px);font-weight:bold;line-height:1.35;background:#fff;border-radius:26px;padding:12px 20px;width:100%}
.sw{display:inline-block;padding:0 4px;border-radius:10px;cursor:pointer}
.sw:active,.sw.on{background:#ffe27a}
.dots{display:flex;gap:8px}.dots i{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #ffa534}.dots i.on{background:#ffa534}
.cover{font-size:clamp(70px,14vw,110px)}

/* maths visuals */
.grp{display:inline-flex;flex-direction:column;gap:4px;align-items:center;vertical-align:middle}
.grp div{display:flex;gap:4px}
.grp span{font-size:clamp(28px,6vw,46px);line-height:1.1;position:relative}
.grp span.x{opacity:.35;filter:grayscale(1)}
.grp span.x::after{content:'✖';position:absolute;left:0;right:0;top:0;color:#e62e2e;font-size:1em;opacity:1}
.mv{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;min-height:90px}
.mv .op{font-size:clamp(34px,7vw,56px);font-weight:bold;color:#ff5a2c}
.seq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.seq b{background:#fff;border:4px solid #3aa0e0;border-radius:18px;min-width:70px;padding:6px 10px;font-size:clamp(34px,8vw,60px)}
.seq b.q2{background:#fff3b0;border-color:#ff9a1f}
.bar{height:34px;border-radius:18px}
.opt .grp span{font-size:clamp(22px,4.5vw,34px)}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.panel{background:#fff;border-radius:24px;padding:20px;max-width:520px;width:100%;font-size:18px}
.panel h2{margin:0 0 8px}
.panel button{display:block;width:100%;margin:10px 0;padding:14px;font-size:18px;background:#3aa0e0}
.panel .on{background:#e62e2e}
.c0{border-color:#ff6b6b;color:#d63a3a}.c1{border-color:#ffa534;color:#c76a00}.c2{border-color:#2fb86a;color:#1b8a4b}.c3{border-color:#3aa0e0;color:#2377b0}.c4{border-color:#a67cf0;color:#6d3fc7}.c5{border-color:#f0509a;color:#c02371}
.red{background:#ff6b6b;border:0;box-shadow:0 6px 0 #b83030}
.red .g{font-size:clamp(34px,7vw,56px);color:#fff}
</style>

    if(sg.k==='v'){
      const o=ctx.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(PITCH*1.04,t);o.frequency.linearRampToValueAtTime(PITCH*.9,t+d);

async function renderPhon(key){
  const spec=PH[key];if(!spec)return;
  const dur=Math.max(...spec.map(s=>s.s+s.d))+.15;
  const oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,Math.ceil(SR*dur),SR);
  build(oc,spec);
  const b=await oc.startRendering();const d=b.getChannelData(0);let sum=0,pk=0;
  for(let i=0;i<d.length;i++){sum+=d[i]*d[i];pk=Math.max(pk,Math.abs(d[i]))}
  const rms=Math.sqrt(sum/d.length)||1;const sc=Math.min(.14/rms,.9/(pk||1));for(let i=0;i<d.length;i++)d[i]*=sc;
  BUF[key]=b;

function synth(key){
  const b=BUF[key];if(!b){if(PH[key])renderPhon(key).then(()=>synth(key)).catch(()=>{});return PH[key]?true:false}
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();speechSynthesis.cancel();

function record(key,cardEl){
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    const mr=new MediaRecorder(st),chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());const r=new FileReader();r.onload=()=>{S.recs[key]=r.result;store.set('recs',S.recs);cardEl.classList.remove('rec');beep(true)};r.readAsDataURL(new Blob(chunks,{type:mr.mimeType}))};
    cardEl.classList.add('rec');mr.start();setTimeout(()=>mr.state!=='inactive'&&mr.stop(),1400);
  }).catch(()=>alert('Microphone not available. Please allow microphone access.'));
}

const ROUNDS=8;
function quiz(title,gen,o={}){
  const qs=gen();let n=0,score=0,locked=false;const d=el('<div class="game"></div>');
  function ask(){
    locked=false;

      if(o.key){S.best[o.key]=Math.max(S.best[o.key]||0,score);store.set('best',S.best)}
      d.innerHTML=`<div class="cheer">🎉 ${score>=qs.length*.8?'Brilliant!':score>=qs.length*.5?'Well done!':'Good try!'} 🎉</div><div class="q">${score>=qs.length*.8?'🏆':'🌟'}</div><div class="prompt" style="cursor:default">You got ${score} out of ${qs.length}!</div><div class="row2"><button class="btn go" style="background:#43a82b" id="again">Play again</button><button class="btn go" style="background:#8453e0" id="bk2">⬅ Back</button></div>`;
      confetti(40);beep(true);addStar(Math.max(1,Math.round(score/2)));$('#again').onclick=rerun;$('#bk2').onclick=back;return;
    }

    d.innerHTML=`<div class="prog"><i style="width:${n/qs.length*100}%"></i></div><div class="prompt" id="pr">${q.prompt}${q.play||q.say?' 🔊':''}</div>${q.visual?`<div id="vis">${q.visual}</div>`:''}<div class="opts" style="grid-template-columns:repeat(${cc},1fr)">${q.opts.map((x,i)=>`<div class="opt ${q.cls||''}" data-i="${i}">${x.h}</div>`).join('')}</div>`;
    const play=()=>{q.play?q.play():q.say&&tts(q.say,.85)};
    if(q.play||q.say){setTimeout(play,350);$('#pr').onclick=play;const v2=$('#vis');if(v2&&q.tapVisual)v2.onclick=play}
    d.querySelectorAll('.opt').forEach(op=>op.onclick=()=>{
      if(locked)return;const x=q.opts[+op.dataset.i];
      if(x.v===q.ans){locked=true;op.classList.add('good');beep(true);confetti(8);score++;n++;q.after&&q.after();setTimeout(ask,q.after?1500:1000)}
      else{op.classList.add('bad');beep(false);setTimeout(()=>op.classList.remove('bad'),500)}

/* option helpers */
function strOpts(correct,pool,n=3,fmt=x=>x){
  const others=shuffle([...new Set(pool.filter(x=>x!==correct))]).slice(0,n-1);
  return shuffle([correct,...others]).map(x=>({h:fmt(x),v:x}));
}
const allItems=()=>Object.values(SETS).flatMap(s=>[...(s.sounds||[]),...(s.special||[]),...(s.chatty||[])]);
const baseG=g=>g.replace(/\d|_/g,'');
function itemDistract(q,pool,n){ // items not sharing sound with q and whose word lacks q's letters
  const ok=o=>sk(o)!==sk(q)&&o.g!==q.g&&!o.w.includes(baseG(q.g));
  const a=shuffle(pool.filter(ok));const b=shuffle(allItems().filter(ok));
  const out=[];for(const o of [...a,...b]){if(!out.some(x=>sk(x)===sk(o)||x.w===o.w))out.push(o);if(out.length>=n)break}
  return out;
}

function mathsMenu(){

    d.appendChild(menuGrid(bks.map(b=>{const id=b[1];const best=S.best['m:'+id];return [b[0],b[1],()=>nav(()=>quiz(b[0]+' '+b[1],()=>Array.from({length:10},()=>b[2]()),{key:'m:'+id,bg:'#e3f4ff'})),col,best!=null?'⭐ best '+best+'/10':'new!']})));

/* =================== PARENT PANEL =================== */
function parentPanel(){
  const m=$('#modal');
  m.innerHTML=`<div class="modal"><div class="panel"><h2>👨‍👩‍👦 Grown-up corner</h2>
  <p>Record <b>your own voice</b> for sounds and words: turn on Record mode, open a card screen (or Tricky Words) and tap a card to record 1.5 seconds.</p>
  <button class="btn ${S.recMode?'on':''}" id="rm">${S.recMode?'⏺ Record mode is ON (tap to turn off)':'🎙 Turn on Record mode'}</button>
  <button class="btn" style="background:#ff9a1f" id="rs">Reset stars</button>
  <button class="btn" style="background:#999" id="cl">Delete my recordings</button>
  <button class="btn" style="background:#43a82b" id="cx">Close</button></div></div>`;
  $('#rm').onclick=()=>{S.recMode=!S.recMode;m.innerHTML='';if(S.recMode)alert('Record mode ON. Tap any sound or tricky-word card to record your voice. Turn it off here when done.')};
  $('#rs').onclick=()=>{S.stars=0;store.set('stars',0);m.innerHTML='';rerun()};
  $('#cl').onclick=()=>{S.recs={};store.set('recs',{});m.innerHTML=''};
  $('#cx').onclick=()=>m.innerHTML='';
}
nav(homeScreen);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
